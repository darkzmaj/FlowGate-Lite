plugins {
    id 'java'
}

group = 'si.terona'
version = '1.0.8'

// Velocity 4 API classes are Java 25 bytecode, so compile with JDK 25 while still
// emitting Java 17 bytecode for BungeeCord/Waterfall and Velocity 3 proxies.
java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "minecraft-libraries"
        url = "https://libraries.minecraft.net/"
    }
}

// Platform APIs (and the SnakeYAML both proxies ship) are provided at runtime; nothing is shaded.
dependencies {
    compileOnly 'net.md-5:bungeecord-api:1.21-R0.4'
    compileOnly 'com.velocitypowered:velocity-api:4.3.1'

    testImplementation 'net.md-5:bungeecord-api:1.21-R0.4'
    testImplementation 'com.velocitypowered:velocity-api:4.3.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// velocity-api 4.x declares JVM 25; resolve it as such while emitting Java 17 bytecode.
// Only API members that are identical in Velocity 3.x are used, so one jar serves both.
['compileClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].each { name ->
    configurations.named(name) {
        attributes { attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25) }
    }
}


jar {
    archiveBaseName.set("FlowGate-Lite")
    archiveVersion.set(project.version.toString())
}

def pluginVersion = project.version.toString()
test {
    useJUnitPlatform()
    systemProperty 'flowgate.version', pluginVersion
}
processResources {
    inputs.property 'version', pluginVersion
    filesMatching(['bungee.yml', 'velocity-plugin.json']) { expand(version: pluginVersion) }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
